<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>رحلة المتغيرات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Lalezar&display=swap">
<style>
/* Layout: one column. Player card with an XP ring, streak + daily quests, a winding level path, then achievements. In a level: segmented progress, hearts, combo, one question card. */
:root{
  --bg:#171433; --surface:#211D47; --surface-2:#2C2761; --line:#3B3578;
  --ink:#F2EFFF; --mute:#ABA5D8;
  --accent:#9D8FFF; --on-accent:#171433; --accent-soft:#2E2866;
  --gold:#FFC145; --gold-ink:#FFC145; --on-gold:#2B1D00;
  --flame:#FF7F50;
  --cog:#3ECFC0; --skill:#F5AA3C; --aff:#F57FA6; --boss:#FF7F50;
  --good:#46DE9C; --good-bg:#12392F; --bad:#FF7081; --bad-bg:#431F34;
  --code:#1B1740; --shadow:0 12px 32px rgba(8,5,30,.5);
  --font-ui:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-display:'Lalezar','Cairo',system-ui,sans-serif;
  --font-code:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F0FF; --surface:#FFFFFF; --surface-2:#E8E5FB; --line:#D2CCF1;
    --ink:#1E1A44; --mute:#5C5790;
    --accent:#5A4BD8; --on-accent:#FFFFFF; --accent-soft:#E6E3FA;
    --gold-ink:#8F5700; --flame:#E4572E;
    --cog:#0F7F76; --skill:#A85F00; --aff:#B0345A; --boss:#C8431B;
    --good:#13804F; --good-bg:#DCF3E8; --bad:#BA2F44; --bad-bg:#FBE1E5;
    --code:#EEEBFC; --shadow:0 10px 26px rgba(60,46,140,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F0FF; --surface:#FFFFFF; --surface-2:#E8E5FB; --line:#D2CCF1;
  --ink:#1E1A44; --mute:#5C5790;
  --accent:#5A4BD8; --on-accent:#FFFFFF; --accent-soft:#E6E3FA;
  --gold-ink:#8F5700; --flame:#E4572E;
  --cog:#0F7F76; --skill:#A85F00; --aff:#B0345A; --boss:#C8431B;
  --good:#13804F; --good-bg:#DCF3E8; --bad:#BA2F44; --bad-bg:#FBE1E5;
  --code:#EEEBFC; --shadow:0 10px 26px rgba(60,46,140,.14);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#171433; --surface:#211D47; --surface-2:#2C2761; --line:#3B3578;
  --ink:#F2EFFF; --mute:#ABA5D8;
  --accent:#9D8FFF; --on-accent:#171433; --accent-soft:#2E2866;
  --gold-ink:#FFC145; --flame:#FF7F50;
  --cog:#3ECFC0; --skill:#F5AA3C; --aff:#F57FA6; --boss:#FF7F50;
  --good:#46DE9C; --good-bg:#12392F; --bad:#FF7081; --bad-bg:#431F34;
  --code:#1B1740; --shadow:0 12px 32px rgba(8,5,30,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.7;direction:rtl;
  padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
code{font-family:var(--font-code);font-size:.86em;direction:ltr;unicode-bidi:isolate;background:var(--code);padding:.05em .4em;border-radius:5px;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.45rem;line-height:1.2}
.mark{font-family:var(--font-code);font-weight:500;font-size:.9rem;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:2px 9px;direction:ltr}
.tools{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:var(--accent)}

/* buttons */
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:10px 24px;font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.gold:active:not([disabled]){box-shadow:0 1px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.big{padding:13px 28px;font-size:1.08rem}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--mute);text-decoration:underline;padding:4px;font-size:.84rem;align-self:flex-start}

/* player card */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.ringwrap{position:relative;width:116px;height:116px;flex:none}
.ring{width:116px;height:116px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:var(--surface-2)}
.ring .pg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.avatar{position:absolute;inset:15px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-weight:500;font-size:1.55rem;direction:ltr}
.lvpill{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--on-gold);font-family:var(--font-display);border-radius:99px;padding:0 12px;font-size:1rem;line-height:1.7;white-space:nowrap}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who h1{font-family:var(--font-display);font-size:2rem;line-height:1.25;font-weight:400;overflow-wrap:anywhere}
.rank{color:var(--accent);font-weight:700}
.xpline{color:var(--mute);font-size:.92rem}
.xpline b{font-family:var(--font-display);font-weight:400;font-size:1.25rem;color:var(--gold-ink);margin-inline-end:2px}
.cta{grid-column:1 / -1;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:4px}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.profile label{font-weight:700;font-size:.9rem}
.profile input{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 14px;width:100%}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);font-family:var(--font-code);font-size:.95rem;direction:ltr;padding:0}
.avs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* streak + quests */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ptitle{font-family:var(--font-display);font-size:1.25rem;line-height:1.3;font-weight:400}
.streak{display:flex;align-items:center;gap:12px}
.flame{width:46px;height:46px;flex:none;fill:var(--flame);stroke:var(--flame);stroke-width:1.2;stroke-linejoin:round}
.flame.off{fill:none;stroke:var(--line);stroke-width:1.8}
.sn{font-family:var(--font-display);font-size:2.5rem;line-height:1;color:var(--ink)}
.sl{color:var(--mute);font-size:.86rem;line-height:1.4}
.week{display:flex;gap:6px;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--mute);font-weight:600}
.day i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:block}
.day.on i{background:var(--flame);border-color:var(--flame)}
.day.today{color:var(--ink)}
.day.today i{border-color:var(--ink)}
.day.on.today i{border-color:var(--flame)}
.quests{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.qchk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;grid-row:span 2}
.qchk svg{width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.quest.done .qchk{background:var(--good);border-color:var(--good)}
.quest.done .qchk svg{opacity:1}
.qt{font-weight:600;font-size:.92rem;line-height:1.45}
.qxp{font-family:var(--font-display);color:var(--gold-ink);font-size:1.05rem;white-space:nowrap}
.qbar{grid-column:2 / 4;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.quest.done .qbar i{background:var(--good)}

/* path */
.sect{font-family:var(--font-display);font-size:1.6rem;line-height:1.3;font-weight:400}
.sub{color:var(--mute);font-size:.9rem;margin-top:-14px}
.path{position:relative;direction:ltr;height:calc(var(--n) * 150px + 10px)}
.path svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seg{fill:none;stroke:var(--line);stroke-width:5;stroke-dasharray:2 12;stroke-linecap:round;vector-effect:non-scaling-stroke}
.seg.done{stroke:var(--gold);stroke-dasharray:none;stroke-width:6}
.node{position:absolute;width:150px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;direction:rtl;text-align:center;background:none;border:0;padding:0;line-height:1.35}
.node[disabled]{cursor:not-allowed}
.circ{position:relative;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2rem;line-height:1;border:4px solid var(--c);background:var(--surface);color:var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,var(--bg));transition:transform .12s}
.node:not([disabled]):hover .circ{transform:translateY(-3px)}
.node:not([disabled]):active .circ{transform:translateY(2px)}
.node.done .circ{background:var(--c);color:var(--on-accent)}
.node.locked .circ{--c:var(--mute);border-color:var(--line);color:var(--mute);background:var(--surface-2);box-shadow:none}
.node.boss .circ{width:92px;height:92px}
.circ svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node.boss .circ svg{width:40px;height:40px;fill:currentColor}
.node.cur .circ::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:ping 1.9s ease-out infinite}
@keyframes ping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.nm{font-weight:800;font-size:.98rem}
.node.locked .nm{color:var(--mute)}
.sc{font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums}
.goal{font-size:.8rem;color:var(--mute);max-width:150px}
.stars{display:flex;gap:2px}
.stars svg{width:17px;height:17px}
.star-on{fill:var(--c);stroke:var(--c)}
.star-off{fill:none;stroke:var(--line)}

/* achievements */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.bd{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;min-width:0}
.bd.rare{border-color:var(--accent)}
.bd.epic{border-color:var(--gold)}
.bd .gl{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-code);font-weight:500;font-size:1.02rem;direction:ltr;background:var(--c);color:var(--t);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--t) 22%,transparent)}
.bd.off .gl{background:var(--surface-2);color:var(--mute);box-shadow:none}
.bd b{font-size:.92rem;line-height:1.4}
.bd span{font-size:.76rem;color:var(--mute);line-height:1.45}
.bd .rt{position:absolute;top:8px;inset-inline-start:8px;font-size:.68rem;font-weight:700;color:var(--accent)}
.bd.epic .rt{color:var(--gold-ink)}
.note{font-size:.82rem;color:var(--mute)}

/* level screen */
.qtop{display:flex;align-items:center;gap:12px}
.segs{flex:1;display:flex;gap:5px;min-width:0}
.seg1{flex:1;height:10px;border-radius:6px;background:var(--surface-2)}
.seg1.cur{background:var(--accent)}
.seg1.ok{background:var(--good)}
.seg1.half{background:var(--gold)}
.seg1.bad{background:var(--bad)}
.hearts{display:flex;gap:3px}
.hearts svg{width:24px;height:24px}
.h-on{fill:var(--bad);stroke:var(--bad)}
.h-off{fill:none;stroke:var(--line);stroke-width:2}
.hearts .lost{animation:heartpop .5s}
@keyframes heartpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.lvline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lvname{font-family:var(--font-display);font-size:1.5rem;line-height:1.3}
.lvname small{display:block;font-family:var(--font-ui);font-size:.8rem;font-weight:700;color:var(--c)}
.hud{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:1px 12px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--surface);border:1.5px solid var(--line)}
.chip.combo{background:var(--flame);border-color:var(--flame);color:var(--on-accent)}
.chip.combo svg{width:16px;height:16px;fill:currentColor}
.chip.combo.bump{animation:bump .4s}
@keyframes bump{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.qcard.flash{animation:flashok .6s}
.qcard.shake{animation:shake .4s}
@keyframes flashok{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.qmeta{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--mute)}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.75}
.codeview{font-family:var(--font-code);direction:ltr;text-align:left;background:var(--code);border-radius:10px;padding:10px 14px;font-size:.92rem;overflow-x:auto;white-space:pre}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:start;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;min-width:0;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{font-family:var(--font-code);font-size:.78rem;color:var(--mute);width:20px;flex:none;direction:ltr}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.7;cursor:not-allowed;box-shadow:none}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good)}
.fillin{font-family:var(--font-code);direction:ltr;text-align:left;font-size:1rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 14px;width:100%}
.pool,.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border-radius:14px;direction:ltr;justify-content:flex-start}
.answer{border:2px dashed var(--line)}
.pool{background:var(--surface-2)}
.tok{font-family:var(--font-code);font-size:.92rem;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:4px 12px;direction:ltr;white-space:pre;box-shadow:0 3px 0 var(--line)}
.tok.used{opacity:.25;cursor:default;box-shadow:none}
.tags{font-size:.8rem;font-weight:700;color:var(--mute)}
.sel-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center}
.sel-row select{font:inherit;font-size:.95rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;width:100%;min-width:0}
.sel-row.right select{border-color:var(--good)}
.sel-row.wrong select{border-color:var(--bad)}
.sel-row .lab{direction:ltr;text-align:right;min-width:0;overflow-wrap:anywhere}
.fb{border-radius:14px;padding:11px 14px;font-weight:700;font-size:.97rem}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .why{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.fb .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.xpchip{display:inline-flex;gap:6px;align-items:center;background:var(--gold);color:var(--on-gold);font-family:var(--font-display);font-weight:400;font-size:1.05rem;line-height:1.6;border-radius:99px;padding:0 12px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.hintbox{background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:.92rem}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* result */
.result{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:var(--shadow)}
.result h2{font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1.3}
.medalrow{display:flex;gap:8px}
.medalrow svg{width:52px;height:52px}
.medalrow svg.star-on{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.medalrow svg:nth-child(2){animation-delay:.25s!important}
.medalrow svg:nth-child(3){animation-delay:.5s!important}
.big{font-family:var(--font-display);font-size:4rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.big small{font-family:var(--font-ui);font-size:.95rem;color:var(--mute)}
.xpbox{width:min(100%,380px);display:flex;flex-direction:column;gap:6px}
.xprow{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem}
.xpbar{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--gold);border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brk{display:grid;grid-template-columns:1fr auto;gap:2px 20px;font-size:.95rem;font-variant-numeric:tabular-nums;width:min(100%,380px);text-align:start}
.brk b{text-align:end}
.earned{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.earned .bd{width:150px}
.review{width:100%;text-align:start;display:flex;flex-direction:column;gap:8px}
.review h3{font-size:1rem}
.rv{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem;line-height:1.7}

    var w=document.getElementById('toasts'),d=document.createElement('div');
    d.className='toast '+(kind||'');d.textContent=msg;w.appendChild(d);
    while(w.children.length>3)w.removeChild(w.firstChild);
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3600);
  }
  var AC=null;
  var SEQ={
    ok:[[660,0,.09],[880,.09,.15]],bad:[[190,0,.2]],click:[[520,0,.04]],
    quest:[[523,0,.1],[659,.1,.1],[784,.2,.2]],
    win:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.32]],
    lvl:[[392,0,.1],[523,.1,.1],[659,.2,.1],[784,.3,.1],[1047,.4,.38]],
    lose:[[330,0,.18],[262,.18,.18],[196,.36,.3]]
  };
  function sfx(k){
    if(!S.sound)return;
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended')AC.resume();
      var n=AC.currentTime,seq=SEQ[k]||[];
      seq.forEach(function(x){
        var o=AC.createOscillator(),g=AC.createGain();
        o.type=(k==='bad'||k==='lose')?'sawtooth':'triangle';
        o.frequency.value=x[0];
        g.gain.setValueAtTime(.0001,n+x[1]);
        g.gain.exponentialRampToValueAtTime(.1,n+x[1]+.012);
        g.gain.exponentialRampToValueAtTime(.0001,n+x[1]+x[2]);
        o.connect(g);g.connect(AC.destination);
        o.start(n+x[1]);o.stop(n+x[1]+x[2]+.03);
      });
    }catch(e){}
  }
  var cv=document.getElementById('fx'),cx=cv.getContext('2d'),parts=[],raf=0;
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(function(p){
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
      cx.globalAlpha=Math.max(0,1-p.life/150);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore();
    });
    parts=parts.filter(function(p){return p.life<150&&p.y<cv.height+30});
    if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}
  }
  function burst(n){
    if(reduced())return;
    cv.width=window.innerWidth;cv.height=window.innerHeight;
    var cols=['#FFC145','#9D8FFF','#3ECFC0','#F57FA6','#FF7F50'];
    for(var i=0;i<n;i++){
      parts.push({x:cv.width/2+(Math.random()-.5)*140,y:cv.height*.38,vx:(Math.random()-.5)*13,vy:-Math.random()*12-3,g:.3,s:7+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0});
    }
    if(!raf)loop();
  }
  function countUp(el,to){
    if(!el)return;
    if(reduced()){el.textContent=to;return}
    var t0=performance.now(),d=900;
    (function f(t){var p=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
  }
  function later(fn){requestAnimationFrame(function(){requestAnimationFrame(fn)})}

  /* ---------- level ---------- */
  function startLevel(i){
    closeOv();
    var L=ALL[i],qs;
    if(L.boss){var pool=[];LEVELS.forEach(function(x){x.qs.forEach(function(q){pool.push(q)})});qs=shuffle(pool).slice(0,L.count)}
    else qs=L.qs;
    var prev=S.levels[L.id];
    R={li:i,qs:qs,qi:0,hearts:L.hearts||HEARTS,maxH:L.hearts||HEARTS,points:0,wrongAny:false,hintsUsed:0,attempts:0,hintShown:false,hintCharged:false,
       locked:false,dead:false,reveal:false,fb:null,fx:null,t0:Date.now(),state:null,res:[],missed:[],combo:0,bestCombo:0,xpGain:0,startXp:S.xp,
       mult:(prev&&prev.medal>=1)?.5:1,result:null};
    prepQ();renderQ();window.scrollTo(0,0);
  }
  function prepQ(){
    var q=R.qs[R.qi];
    R.attempts=0;R.hintShown=false;R.hintCharged=false;R.locked=false;R.fb=null;R.reveal=false;R.fx=null;
    if(q.t==='choice')R.state={sel:-1,bad:[]};
    else if(q.t==='fill')R.state={val:''};
    else if(q.t==='order'){
      var idx=q.tok.map(function(_,k){return k}),sh,tries=0;
      do{sh=shuffle(idx);tries++}while(sh.every(function(v,k){return v===k})&&tries<20);
      R.state={pool:sh,ans:[]};
    }else if(q.t==='select')R.state={vals:q.rows.map(function(){return ''}),res:null};
  }
  function level(){return ALL[R.li]}
  function renderQ(){
    var L=level(),q=R.qs[R.qi],col=DOM[L.dom][1];
    var sg='';
    for(var i=0;i<R.qs.length;i++){sg+='<i class="seg1 '+(R.res[i]||(i===R.qi?'cur':''))+'"></i>'}
    var h='<div class="qtop"><button class="ib" data-act="quit" aria-label="الخروج إلى الخريطة">'+XICON+'</button>'+
      '<div class="segs" role="img" aria-label="السؤال '+(R.qi+1)+' من '+R.qs.length+'">'+sg+'</div>'+
      '<div class="hearts" role="img" aria-label="القلوب المتبقية '+R.hearts+'">'+heartsSvg(R.hearts,R.maxH,R.fx==='bad'?R.hearts:-1)+'</div></div>';
    h+='<div class="lvline" style="--c:'+col+'"><div class="lvname"><small>'+(L.boss?DOM[L.dom][0]:'المستوى '+(R.li+1)+'، '+DOM[L.dom][0])+'</small>'+L.name+'</div>'+
       '<div class="hud">'+(R.combo>=2?'<span class="chip combo'+(R.fx==='ok'?' bump':'')+'" aria-label="كومبو '+R.combo+'">'+flame('')+'×'+R.combo+'</span>':'')+
       '<span class="chip">'+R.points+' نقطة</span></div></div>';
    h+='<div class="qcard'+(R.fx==='ok'?' flash':R.fx==='bad'?' shake':'')+'" style="--c:'+col+'">';
    h+='<div class="qmeta"><span>السؤال '+(R.qi+1)+' من '+R.qs.length+'</span><span>'+L.pts+' نقطة للسؤال</span></div>';
    h+='<div class="qtext">'+q.q+'</div>';
    if(q.code)h+='<div class="codeview">'+esc(q.code)+'</div>';
    h+=qBody(q);
    h+='<div id="fb" aria-live="polite">'+fbHtml()+'</div>';
    if(R.hintShown)h+='<div class="hintbox">تلميح: '+esc(q.h)+'</div>';
    h+='<div class="qfoot"><button class="btn ghost" data-act="hint"'+((R.locked||R.hintShown)?' disabled':'')+'>تلميح (−'+HINT_COST+')</button>'+
       '<span class="row">'+footBtns(q)+'</span></div></div>';
    app.innerHTML=h;
    var f=app.querySelector('[data-focus]');if(f)f.focus({preventScroll:true});
  }
  function qBody(q){
    var s=R.state,h='';
    if(q.t==='choice'){
      h+='<div class="opts">';
      q.o.forEach(function(o,i){
        var cls='opt'+(s.sel===i?' sel':'')+(s.bad.indexOf(i)>-1?' wrong':'')+((R.reveal&&i===q.a)||(R.locked&&R.fb&&R.fb.ok&&s.sel===i)?' right':'');
        var dis=(R.locked||s.bad.indexOf(i)>-1)?' disabled':'';
        h+='<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+dis+'><span class="k">'+(i+1)+'</span><span>'+o+'</span></button>';
      });
      return h+'</div>';
    }
    if(q.t==='fill'){
      return '<input class="fillin" id="fillv" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" value="'+esc(s.val)+'"'+(R.locked?' disabled':' data-focus')+' aria-label="إجابتك">';
    }
    if(q.t==='order'){
      h+='<div class="tags">إجابتك (اضغط على القطعة لإزالتها)</div><div class="answer">';
      s.ans.forEach(function(k,p){h+='<button class="tok" data-act="unorder" data-p="'+p+'"'+(R.locked?' disabled':'')+'>'+esc(q.tok[k])+'</button>'});
      h+='</div><div class="tags">القطع المتاحة</div><div class="pool">';
      s.pool.forEach(function(k){var used=s.ans.indexOf(k)>-1;h+='<button class="tok'+(used?' used':'')+'" data-act="order" data-k="'+k+'"'+((used||R.locked)?' disabled':'')+'>'+esc(q.tok[k])+'</button>'});
      return h+'</div>';
    }
    if(q.t==='select'){
      q.rows.forEach(function(r,i){
        var cls='sel-row'+(s.res?(s.res[i]?' right':' wrong'):'');
        h+='<div class="'+cls+'"><div class="lab">'+c(r[0])+'</div><select data-act="sel" data-i="'+i+'" aria-label="نوع '+esc(r[0])+'"'+(R.locked?' disabled':'')+'><option value="">اختر...</option>';
        q.opts.forEach(function(o){h+='<option value="'+esc(o)+'"'+(s.vals[i]===o?' selected':'')+'>'+esc(o)+'</option>'});
        h+='</select></div>';
      });
      return h;
    }
    return '';
  }
  function fbHtml(){
    if(!R.fb)return '';
    var f=R.fb;
    return '<div class="fb '+(f.ok?'ok':'no')+'"><div class="top"><span>'+f.msg+'</span>'+(f.ok&&f.xp?'<span class="xpchip">+'+f.xp+' XP</span>':'')+'</div>'+(f.why?'<span class="why">'+f.why+'</span>':'')+'</div>';
  }
  function ready(q){
    var s=R.state;
    if(q.t==='choice')return s.sel>-1;
    if(q.t==='fill')return s.val.trim()!=='';
    if(q.t==='order')return s.ans.length===q.tok.length;
    if(q.t==='select')return s.vals.every(function(v){return v!==''});
    return false;
  }
  function footBtns(q){
    if(R.locked){
      return R.dead?'<button class="btn" data-act="finish" data-focus>النتيجة</button>':'<button class="btn" data-act="next" data-focus>'+(R.qi===R.qs.length-1?'إنهاء المستوى':'السؤال التالي')+'</button>';
    }
    return '<button class="btn" data-act="check"'+(ready(q)?'':' disabled')+'>تحقق</button>';
  }
  function norm(s){return String(s).replace(/؛/g,';').replace(/ثم/g,'').replace(/[\s،,]/g,'').toLowerCase()}
  function isCorrect(q){
    var s=R.state;
    if(q.t==='choice')return s.sel===q.a;
    if(q.t==='fill')return q.acc.some(function(a){return norm(a)===norm(s.val)});
    if(q.t==='order')return s.ans.every(function(k,p){return k===p});
    if(q.t==='select'){s.res=q.rows.map(function(r,i){return s.vals[i]===r[1]});return s.res.every(Boolean)}
    return false;
  }
  function answerText(q){
    if(q.t==='choice')return q.o[q.a];
    if(q.t==='fill')return c(q.acc[0]==='=;'?'= ثم ;':q.acc[0]);
    if(q.t==='order')return c(q.tok.join('  '));
    if(q.t==='select')return q.rows.map(function(r){return c(r[0])+' ← '+esc(r[1])}).join('، ');
    return '';
  }
  function afterAction(){var qx=checkQuests();R.xpGain+=qx;save()}
  function check(){
    var L=level(),q=R.qs[R.qi];
    if(R.locked||!ready(q))return;
    rollQuest();touchDay();
    var ok=isCorrect(q);
    S.stats.answered++;S.quest.ans++;
    if(ok){
      var first=R.attempts===0;
      var p=Math.round(L.pts*(first?1:.5));
      if(R.hintCharged)p=Math.max(0,p-HINT_COST);
      R.points+=p;
      var bonus=0;
      if(first){R.combo++;R.bestCombo=Math.max(R.bestCombo,R.combo);S.quest.combo=Math.max(S.quest.combo,R.combo);bonus=R.combo>=3?Math.min(R.combo-2,5):0}
      else R.combo=0;
      var gain=Math.round((p+bonus)*R.mult);
      S.xp+=gain;R.xpGain+=gain;S.stats.correct++;
      R.locked=true;R.res[R.qi]=p>=L.pts?'ok':'half';R.fx='ok';
      R.fb={ok:true,msg:bonus?'إجابة صحيحة، كومبو ×'+R.combo:(first?'إجابة صحيحة':'إجابة صحيحة بنصف النقاط'),why:esc(q.e),xp:gain};
      sfx('ok');
    }else{
      R.attempts++;R.hearts--;R.wrongAny=true;R.combo=0;R.fx='bad';
      if(q.t==='choice'){R.state.bad.push(R.state.sel);R.state.sel=-1}
      sfx('bad');
      if(R.hearts<=0){
        R.locked=true;R.dead=true;R.reveal=true;R.res[R.qi]='bad';
        R.fb={ok:false,msg:'انتهت القلوب',why:'الإجابة الصحيحة: '+answerText(q)};
        R.missed.push({q:q.q,a:answerText(q)});
      }else if(R.attempts>=2){
        R.locked=true;R.reveal=true;R.res[R.qi]='bad';
        R.fb={ok:false,msg:'إجابة غير صحيحة، لا نقاط لهذا السؤال',why:'الإجابة الصحيحة: '+answerText(q)+'. '+esc(q.e)};
        R.missed.push({q:q.q,a:answerText(q)});
      }else{
        R.fb={ok:false,msg:'إجابة غير صحيحة، لك محاولة ثانية بنصف النقاط'};
      }
    }
    afterAction();
    renderQ();
  }
  function next(){
    if(R.qi<R.qs.length-1){R.qi++;prepQ();renderQ()}
    else finishLevel();
  }
  function finishLevel(){
    var L=level();
    var secs=Math.round((Date.now()-R.t0)/1000),dead=!!R.dead;
    var perfect=!dead&&!R.wrongAny&&R.hintsUsed===0;
    var bonus=perfect?BONUS:0;
    var total=R.points+bonus,max=maxPts(L),ratio=total/max;
    var medal=dead?0:(ratio>=.9?3:ratio>=.75?2:ratio>=.5?1:0);
    var bx=Math.round(bonus*R.mult);
    if(bx){S.xp+=bx;R.xpGain+=bx}
    var newB=[];
    function award(id){if(!S.badges[id]){S.badges[id]=true;newB.push(id)}}
    if(!dead){
      var prev=S.levels[L.id];
      if(!prev||total>prev.total)S.levels[L.id]={total:total,medal:Math.max(medal,prev?prev.medal:0),perfect:perfect};
      else if(medal>prev.medal)prev.medal=medal;
      if(medal>=1&&!L.boss)award(L.id);
      if(medal>=1&&L.boss)award('boss');
      if(perfect)award('perfect');
      if(medal>=2&&secs<=120)award('fast');
      if(medal===3)award('gold');
      if(LEVELS.every(isDone))award('final');
      if(medal>=1){rollQuest();S.quest.fin++}
    }
    if(R.bestCombo>=5)award('combo5');
    if(S.streak.count>=3)award('streak3');
    if(S.streak.count>=7)award('streak7');
    afterAction();
    if(S.xp>=400)award('xp400');
    save();
    var oldL=plevel(R.startXp),newL=plevel(S.xp);
    R.result={dead:dead,total:total,points:R.points,bonus:bonus,medal:medal,secs:secs,newB:newB,max:max,lvUp:newL>oldL?newL:0};
    renderResult();
  }
  function renderResult(){
    var L=level(),r=R.result,col=DOM[L.dom][1],P=prog(S.xp),h=topbar();
    var hasNext=!r.dead&&R.li<ALL.length-1&&unlocked(R.li+1);
    h+='<div class="result" style="--c:'+col+'">';
    if(r.dead){
      h+='<h2>انتهت القلوب</h2><p>راجع الدرس وأعد المستوى. نتيجتك السابقة محفوظة كما هي.</p>';
    }else{
      h+='<h2>'+(r.medal>=1?'أنهيت مستوى '+L.name:'اقتربت من إنهاء '+L.name)+'</h2>';
      h+='<div class="medalrow">'+starsSvg(r.medal)+'</div><div class="note">'+MEDAL[r.medal]+'</div>';
      h+='<div class="big"><span id="cnt" aria-label="'+r.total+'">0</span><small> / '+r.max+'</small></div>';
    }
    h+='<div class="xpbox"><div class="xprow"><span class="xpchip">+'+R.xpGain+' XP</span><span>المستوى '+P.L+' · '+rank(P.L)+'</span></div><div class="xpbar"><i id="xpfill" data-to="'+Math.round(P.pct*100)+'"></i></div></div>';
    if(!r.dead){
      h+='<div class="brk"><span>نقاط الأسئلة</span><b>'+r.points+'</b><span>مكافأة بلا أخطاء أو تلميح</span><b>'+r.bonus+'</b><span>أفضل كومبو</span><b>×'+R.bestCombo+'</b><span>الزمن</span><b>'+Math.floor(r.secs/60)+':'+('0'+(r.secs%60)).slice(-2)+'</b></div>';
      if(r.medal<1)h+='<p class="note">تحتاج 50% من النقاط على الأقل لفتح المستوى التالي. أعد المحاولة.</p>';
    }
    if(r.newB.length){
      h+='<h3 class="ptitle">إنجازات جديدة</h3><div class="earned">'+r.newB.map(function(id){var b=BADGES.filter(function(x){return x.id===id})[0];return badgeHtml(b,true,true)}).join('')+'</div>';
    }
    if(R.missed.length){
      h+='<div class="review"><h3 class="ptitle">للمراجعة</h3>'+R.missed.map(function(m){return '<div class="rv">'+m.q+'<b>الإجابة الصحيحة: '+m.a+'</b></div>'}).join('')+'</div>';
    }
    h+='<div class="row" style="justify-content:center"><button class="btn ghost" data-act="retry">إعادة المستوى</button>'+
       (hasNext?'<button class="btn gold" data-act="nextlevel">المستوى التالي</button>':'')+
       '<button class="btn ghost" data-act="home">الخريطة</button></div></div>';
    app.innerHTML=h;
    window.scrollTo(0,0);
    countUp(document.getElementById('cnt'),r.total);
    later(function(){var e=document.getElementById('xpfill');if(e)e.style.width=e.getAttribute('data-to')+'%'});
    if(r.dead)sfx('lose');
    else if(r.medal>=1){sfx('win');burst(110)}
    if(r.lvUp){setTimeout(function(){if(R&&R.result===r)showLevelUp(r.lvUp)},1500)}
  }
  function showLevelUp(L){
    document.getElementById('ov').innerHTML='<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="lut"><div class="dialog"><div class="lvbig num">'+L+'</div>'+
      '<h2 id="lut">ترقية! أصبحت '+rank(L)+'</h2><p class="note">وصلت إلى المستوى '+L+' في رحلة المتغيرات.</p>'+
      '<button class="btn gold big" id="ovb" data-act="closeov">متابعة</button></div></div>';
    sfx('lvl');burst(160);
    var b=document.getElementById('ovb');if(b)b.focus();
  }
  function closeOv(){document.getElementById('ov').innerHTML=''}

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(!t||t.disabled||t.tagName==='SELECT')return;
    var a=t.getAttribute('data-act');
    if(R&&a!=='check')R.fx=null;
    if(a==='start'){startLevel(+t.getAttribute('data-i'))}
    else if(a==='home'){resetArmed=false;home()}
    else if(a==='quit'){home()}
    else if(a==='retry'){startLevel(R.li)}
    else if(a==='nextlevel'){startLevel(R.li+1)}
    else if(a==='closeov'){closeOv()}
    else if(a==='sound'){
      S.sound=!S.sound;save();if(S.sound)sfx('click');
      document.querySelectorAll('[data-act="sound"]').forEach(function(b){b.innerHTML=soundSvg(S.sound);b.setAttribute('aria-label',S.sound?'إيقاف الصوت':'تشغيل الصوت')});
    }
    else if(a==='theme'){S.theme=effTheme()==='light'?'dark':'light';applyTheme();save()}
    else if(a==='profile'){profileOpen=!profileOpen;home(true)}
    else if(a==='avatar'){S.avatar=+t.getAttribute('data-i');save();home(true)}
    else if(a==='reset'){
      if(resetArmed){var keep={theme:S.theme,sound:S.sound};S=blank();S.theme=keep.theme;S.sound=keep.sound;save();resetArmed=false;profileOpen=false}
      else resetArmed=true;
      home(true);
    }
    else if(R&&!R.result){
      if(a==='pick'){R.state.sel=+t.getAttribute('data-i');sfx('click');renderQ()}
      else if(a==='order'){R.state.ans.push(+t.getAttribute('data-k'));sfx('click');renderQ()}
      else if(a==='unorder'){R.state.ans.splice(+t.getAttribute('data-p'),1);renderQ()}
      else if(a==='hint'){R.hintShown=true;if(!R.hintCharged){R.hintCharged=true;R.hintsUsed++}renderQ()}
      else if(a==='check'){check()}
      else if(a==='next'){next()}
      else if(a==='finish'){finishLevel()}
    }
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(R&&!R.result&&t.getAttribute&&t.getAttribute('data-act')==='sel'){
      R.state.vals[+t.getAttribute('data-i')]=t.value;R.state.res=null;R.fx=null;
      R.fb=R.fb&&!R.fb.ok?R.fb:null;renderQ();
    }
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='nm'){S.name=t.value;save();var hn=document.getElementById('hname');if(hn)hn.textContent=S.name||'لاعب جديد'}
    else if(t.id==='fillv'&&R&&!R.result){
      R.state.val=t.value;
      var q=R.qs[R.qi],btn=app.querySelector('[data-act="check"]');
      if(btn)btn.disabled=!ready(q);
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&document.getElementById('ov').firstChild){closeOv();return}
    if(!R||R.result||document.getElementById('ov').firstChild)return;
    var q=R.qs[R.qi],tag=e.target.tagName;
    if(e.key==='Enter'&&e.target.id==='fillv'){e.preventDefault();check();return}
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    if(q.t==='choice'&&!R.locked&&/^[1-9]$/.test(e.key)){
      var i=+e.key-1;
      if(i<q.o.length&&R.state.bad.indexOf(i)<0){R.fx=null;R.state.sel=i;renderQ()}
      return;
    }
    if(e.key==='Enter'&&e.target===document.body){
      e.preventDefault();
      if(R.locked){R.dead?finishLevel():next()}else check();
    }
  });

  applyTheme();
  home();
})();
</script>

</body></html>
